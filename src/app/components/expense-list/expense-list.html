<div class="expense-list">

 

  <h2>Expenses</h2>

 

  <table>

 

    <tr>

      <th>Amount</th>

      <th>Category</th>

      <th>Description</th>

      <th>Date</th>

     <th>Action</th>

    </tr>

 

    <tr *ngFor="let expense of expenses">

 

      <td>{{ expense.amount }}</td>

 

      <td>{{ expense.category }}</td>

 

      <td>{{ expense.description }}</td>

 

      <td>{{ expense.date }}</td>

       <td>
         <button (click)="editExpense(expense)">
            Edit
        </button>
        <button (click)="deleteExpense(expense.id)">
            Delete
        </button>

       </td>

 

    </tr>

 

  </table>

 

</div>
