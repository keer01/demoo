
<div class="login-container">

 

  <h2>SmartSpend AI Login</h2>

 

  <form (ngSubmit)="loginUser()">

 

    <input

      type="email"

      placeholder="Enter email"

      [(ngModel)]="loginRequest.email"

      name="email"

    >

 

    <input

      type="password"

      placeholder="Enter password"

      [(ngModel)]="loginRequest.password"

      name="password"

    >

 

    <button type="submit">

      Login

    </button>

 

  </form>

 

</div>
